# Standart koli katalogu -- Ozdilek depo ambalaj stogu.
#
# ONEMLI: `inner` olculer urunlerin sigacagi kullanilabilir hacimdir, `wall_cm`
# oluklu mukavva et kalinligidir. Kargo firmasi **dis** olcuyu olcer ve faturayi
# ona gore keser:
#     dis_kenar = ic_kenar + 2 * wall_cm
# Bu ayrimi atlamak her koli icin sistematik olarak dusuk desi tahmin etmeye yol
# acar; buyuk kolilerde fark bir tarife kademesine denk gelebiliyor.

